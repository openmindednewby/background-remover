# ============================================
# Background remover (background-remover) — Deployment + Service
# ============================================
#
# SOURCE   background-remover/ (static HTML/CSS/JS → nginx)
# HOST     background-remover.dloizides.com
#          (add a route in personalServerNotes/k8s/ingress.yml + a TLS secret)
# IMAGE    background-remover:latest (digest-pinned by manage.sh on every deploy)
# BUILD    bash personalServerNotes/scripts/manage.sh deploy background-remover
#          (register in manage.sh:
#            SERVICES[background-remover]="background-remover:nginx.prod.dockerfile"
#            MANIFEST_PATHS[background-remover]="personalServerNotes/k8s/background-remover/deployment.yaml")
#
# REGISTRY: prod references 10.0.0.2:5000; manage.sh patches to localhost:5000 on staging.
#
# Single-page static frontend, single replica (32Mi/64Mi, 10m/100m).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-remover
  namespace: dloizides
  labels:
    app: background-remover
    tier: web-app
    platform: portfolio
    product: background-remover
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background-remover
  template:
    metadata:
      labels:
        app: background-remover
        tier: web-app
        platform: portfolio
        product: background-remover
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: background-remover
          image: 10.0.0.2:5000/background-remover:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: background-remover
  namespace: dloizides
  labels:
    app: background-remover
spec:
  type: ClusterIP
  selector:
    app: background-remover
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
