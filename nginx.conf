server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name  localhost;

    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://analytics.dloizides.com; connect-src 'self' https://analytics.dloizides.com; img-src 'self' blob: data:; worker-src 'self'; style-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    location / {
        add_header Content-Security-Policy $csp always;
        root   /app;
        index  index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Content-Security-Policy $csp always;
        root /app;
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        add_header Content-Security-Policy $csp always;
        root /app;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location /assets/ {
        add_header Content-Security-Policy $csp always;
        root /app;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /bg-removal/ {
        add_header Content-Security-Policy $csp always;
        root /app;
        access_log off;
        types { application/wasm wasm; text/javascript mjs; application/octet-stream onnx; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;
    gzip_min_length 256;
}
