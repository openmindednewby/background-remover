server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name  localhost;

    location / {
        root   /app;
        index  index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        root /app;
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        root /app;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location /assets/ {
        root /app;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /bg-removal/ {
        root /app;
        access_log off;
        types { application/wasm wasm; text/javascript mjs; application/octet-stream onnx; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;
    gzip_min_length 256;
}
